####################################################################################################
#####                              TX Ultimate Easy for ESPHome                                #####
#####                  Repository: https://github.com/edwardtfn/TX-Ultimate-Easy               #####
####################################################################################################
##### Example: ESPHome Configuration with ESP-NOW Support                                      #####
##### This example shows how to configure switches to communicate via ESP-NOW                 #####
####################################################################################################
---
substitutions:
  name: tx-ultimate-easy           # Must be unique per device (e.g., tx-ultimate-easy-1, tx-ultimate-easy-2)
  friendly_name: TX Ultimate Easy  # Must be unique per device
  device_format: EU                # Required: 'EU' or 'US'
  gang_count: 3                    # Required: Number of relays/buttons (1, 2, 3, or 4)

  # Optional: Seed initial ESP-NOW targets at flash time (all editable at runtime in HA)
  espnow_target_mac_button_1: "AA:BB:CC:DD:EE:FF"
  espnow_target_relay_button_1: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  remote_package:
    url: https://github.com/edwardtfn/TX-Ultimate-Easy
    ref: main
    refresh: 5min
    files:
      - ESPHome/TX-Ultimate-Easy-ESPHome_core.yaml
      - ESPHome/TX-Ultimate-Easy-ESPHome_standard.yaml
      - ESPHome/TX-Ultimate-Easy-ESPHome_espnow.yaml  # Add ESP-NOW support

###############################################################################################
##### Configuration Instructions:                                                         #####
#####                                                                                     #####
##### 1. Flash this configuration to your devices.                                        #####
##### 2. In Home Assistant, configure peer-to-peer targets directly from the UI:          #####
#####    - Gang N ESP-NOW Target MAC                                                      #####
#####    - Gang N ESP-NOW Target Gang                                                     #####
#####    - Gang N ESP-NOW Mode (Off, Always, API failsafe only)                           #####
##### 3. On the device receiving commands, enable "ESP-NOW Receive Enabled".              #####
#####                                                                                     #####
##### TIP: Or use the "TX Ultimate Easy - Gang Link" blueprint to automatically bind      #####
#####      MACs, target gangs, and receive states with zero manual typing!                #####
###############################################################################################
...
