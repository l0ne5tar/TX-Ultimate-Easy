substitutions:

  expose_relays_leds_to_ha: false



  # Relay mode is effectively the GANG mode: it selects the entity type for

  # everything attached to that gang, including the physical relay and its

  # virtual relay. 'switch' exposes both as switches, 'light' exposes both as

  # lights, and 'disabled' leaves the physical relay unused (the virtual relay

  # then falls back to a switch).

  relay_1_mode: switch  # 'switch', 'light', or 'disabled'

  relay_2_mode: switch  # 'switch', 'light', or 'disabled'

  relay_3_mode: switch  # 'switch', 'light', or 'disabled'

  relay_4_mode: switch  # 'switch', 'light', or 'disabled'



  relay_1_pulse_time: '0'  # 0 - pulse disabled, otherwise time in seconds to turn_off

  relay_2_pulse_time: '0'  # 0 - pulse disabled, otherwise time in seconds to turn_off

  relay_3_pulse_time: '0'  # 0 - pulse disabled, otherwise time in seconds to turn_off

  relay_4_pulse_time: '0'  # 0 - pulse disabled, otherwise time in seconds to turn_off

  pulse_time_internal: true



  RELAY_1_MODE_LOWER: ${ relay_1_mode | lower }

  RELAY_2_MODE_LOWER: ${ relay_2_mode | lower }

  RELAY_3_MODE_LOWER: ${ relay_3_mode | lower }

  RELAY_4_MODE_LOWER: ${ relay_4_mode | lower }



  SL_RELAY_1_MODE: ${ 1 if RELAY_1_MODE_LOWER == "switch" else (2 if RELAY_1_MODE_LOWER == "light" else 0) }

  SL_RELAY_2_MODE: ${ 1 if RELAY_2_MODE_LOWER == "switch" else (2 if RELAY_2_MODE_LOWER == "light" else 0) }

  SL_RELAY_3_MODE: ${ 1 if RELAY_3_MODE_LOWER == "switch" else (2 if RELAY_3_MODE_LOWER == "light" else 0) }

  SL_RELAY_4_MODE: ${ 1 if RELAY_4_MODE_LOWER == "switch" else (2 if RELAY_4_MODE_LOWER == "light" else 0) }



  RELAY_MODE_TEXT_SWITCH: "Switch"

  RELAY_MODE_TEXT_LIGHT: "Light"

  RELAY_MODE_TEXT_NOT_USED: "Not in use"



  # You shouldn't change the restore mode as there is a custom restoring engine based on globals.

  # The reason of a custom engine is to address an issue where NVS space was exceeded causing saving/restoring issues

  RELAYS_LIGHT_RESTORE_MODE: RESTORE_DEFAULT_OFF

  RELAYS_LIGHT_PARTITION_RESTORE_MODE: ALWAYS_OFF

  RELAYS_SWITCH_RESTORE_MODE: RESTORE_DEFAULT_OFF



  TAG_HW_RELAYS: tx_ultimate_easy.hw.relays



packages:

  relay_gang_1: !include

    file: TX-Ultimate-Easy-ESPHome_hw_relay_gang.yaml

    vars:

      gang: 1

      idx: 0

      pin: GPIO18

  relay_gang_2: !include

    file: TX-Ultimate-Easy-ESPHome_hw_relay_gang.yaml

    vars:

      gang: 2

      idx: 1

      pin: GPIO17

  relay_gang_3: !include

    file: TX-Ultimate-Easy-ESPHome_hw_relay_gang.yaml

    vars:

      gang: 3

      idx: 2

      pin: GPIO27

  relay_gang_4: !include

    file: TX-Ultimate-Easy-ESPHome_hw_relay_gang.yaml

    vars:

      gang: 4

      idx: 3

      pin: GPIO23



esphome:

  build_flags:

    - -D TX_ULTIMATE_EASY_HW_RELAYS



# The virtual state is only authoritative while Home Assistant can see it.

# Repaint when connectivity changes so the LEDs switch between the virtual

# state (connected) and the physical relay state (offline).

api:

  on_client_connected:

    then:

      - delay: 200ms

      - script.execute: show_relay_status

  on_client_disconnected:

    then:

      - script.execute: show_relay_status



wifi:

  on_connect:

    then:

      - script.execute: show_relay_status

  on_disconnect:

    then:

      - script.execute: show_relay_status



globals:

  - id: boot_initialization_relays

    type: bool

    restore_value: false

    initial_value: 'false'

  - id: boot_initialization_relays_group_assignments

    type: bool

    restore_value: false

    initial_value: 'false'

  - id: boot_initialization_relays_light_modes

    type: bool

    restore_value: false

    initial_value: 'false'

  - id: boot_initialization_relays_relay_modes

    type: bool

    restore_value: false

    initial_value: 'false'



  - id: gb_lights_1

    type: std::vector<light::LightState*>

    restore_value: false

  - id: gb_lights_2

    type: std::vector<light::LightState*>

    restore_value: false



  - id: relay_states

    type: bool[4]

    restore_value: false

    initial_value: '{false, false, false, false}'



  # State of the virtual relays. This is the source of truth for the indicator

  # LEDs when the associated button action is a virtual relay. The matching

  # switch/light entity restores its own state on boot and repopulates these.

  - id: virtual_relay_states

    type: bool[4]

    restore_value: false

    initial_value: '{false, false, false, false}'



.light_partition_relays: &light_partition_relays

  platform: partition

  disabled_by_default: false

  default_transition_length: ${default_transition_length}

  gamma_correct: ${LIGHT_GAMMA_CORRECT}

  restore_mode: ${RELAYS_LIGHT_PARTITION_RESTORE_MODE}



