#####                              TX Ultimate Easy for ESPHome                                #####
#####                  Repository: https://github.com/edwardtfn/TX-Ultimate-Easy               #####
##### Purpose: ESPHome - ESP-NOW - Sender - Communication for Multi-Device Relay Control       #####
####################################################################################################
##### Author: jakub-k-dev - https://github.com/jakub-k-dev                                     #####
####################################################################################################
##### NOTE:                                                                                    #####
##### - Make changes ONLY if absolutely necessary and you have the required knowledge.         #####
##### - For normal system use, modifications to this file are NOT required.                    #####
####################################################################################################
---
substitutions:
  # ============================================================================
  # DEFAULT CONFIGURATION (Runtime entities are seeded with these initial values)
  # ============================================================================
  espnow_target_mac_button_1: "00:00:00:00:00:00"
  espnow_target_relay_button_1: 1

  espnow_target_mac_button_2: "00:00:00:00:00:00"
  espnow_target_relay_button_2: 2

  espnow_target_mac_button_3: "00:00:00:00:00:00"
  espnow_target_relay_button_3: 3

  espnow_target_mac_button_4: "00:00:00:00:00:00"
  espnow_target_relay_button_4: 4

  espnow_send_delay: 0ms

  # ============================================================================
  # INTERNAL CONSTANTS
  # ============================================================================
  TAG_ESPNOW_SENDER: tx_ultimate_easy.espnow.sender

  ESPNOW_SEND_MODE_OFF_TEXT: "Off"
  ESPNOW_SEND_MODE_ALWAYS_TEXT: "Always"
  ESPNOW_SEND_MODE_FAILSAFE_TEXT: "API failsafe only"

esphome:
  build_flags:
    - -D TX_ULTIMATE_EASY_ESPNOW_SENDER

packages:
  espnow_sender_gang_1: !include
    file: TX-Ultimate-Easy-ESPHome_espnow_sender_gang.yaml
    vars:
      gang: 1
      idx: 0
  espnow_sender_gang_2: !include
    file: TX-Ultimate-Easy-ESPHome_espnow_sender_gang.yaml
    vars:
      gang: 2
      idx: 1
  espnow_sender_gang_3: !include
    file: TX-Ultimate-Easy-ESPHome_espnow_sender_gang.yaml
    vars:
      gang: 3
      idx: 2
  espnow_sender_gang_4: !include
    file: TX-Ultimate-Easy-ESPHome_espnow_sender_gang.yaml
    vars:
      gang: 4
      idx: 3

espnow:
  id: espnow_component
  auto_add_peer: true
  on_receive:
    lambda: |-
      if (data == nullptr || size < 3) return;
      if (data[0] != 0x02) return;  // State report command (0x02, remote_gang, state)

      const uint8_t remote_gang = data[1];
      const bool remote_state = (data[2] != 0);

      using esphome::tx_ultimate_easy::parse_mac_address;
      esphome::text::Text *const mac_texts[4] = {
        txt_gang_1_espnow_target_mac, txt_gang_2_espnow_target_mac,
        txt_gang_3_espnow_target_mac, txt_gang_4_espnow_target_mac
      };
      esphome::select::Select *const target_gang_selects[4] = {
        sl_gang_1_espnow_target_gang, sl_gang_2_espnow_target_gang,
        sl_gang_3_espnow_target_gang, sl_gang_4_espnow_target_gang
      };
      esphome::select::Select *const mode_selects[4] = {
        sl_gang_1_espnow_mode, sl_gang_2_espnow_mode,
        sl_gang_3_espnow_mode, sl_gang_4_espnow_mode
      };
      esphome::switch_::Switch *const virtual_switches[4] = {
        sw_virtual_relay_1, sw_virtual_relay_2, sw_virtual_relay_3, sw_virtual_relay_4
      };
      esphome::light::LightState *const virtual_lights[4] = {
        light_virtual_relay_1, light_virtual_relay_2, light_virtual_relay_3, light_virtual_relay_4
      };

      for (uint8_t i = 0; i < ${gang_count}; i++) {
        if (mode_selects[i]->active_index().value_or(0) == 0) continue;

        uint8_t target_mac[6];
        if (!parse_mac_address(mac_texts[i]->state, target_mac)) continue;

        if (memcmp(target_mac, info.src_addr, 6) != 0) continue;

        const uint8_t expected_remote_gang = static_cast<uint8_t>(
            target_gang_selects[i]->active_index().value_or(i) + 1);
        if (expected_remote_gang != remote_gang) continue;

        ESP_LOGI("${TAG_ESPNOW_SENDER}",
                 "ESP-NOW state sync: remote gang %" PRIu8 " -> local gang %" PRIu8 " = %s",
                 remote_gang, i + 1, remote_state ? "ON" : "OFF");

        id(virtual_relay_states)[i] = remote_state;
        show_relay_status->execute();

        if (virtual_switches[i]->state != remote_state) {
          virtual_switches[i]->publish_state(remote_state);
        }
        if (virtual_lights[i]->current_values.is_on() != remote_state) {
          virtual_lights[i]->current_values.set_state(remote_state);
          virtual_lights[i]->publish_state();
        }
      }

script:
  - id: !extend button_click_event
    then:
      - lambda: |-
          if (click_count != 1) {
            return;
          }
          espnow_send->execute(button);

  - id: !extend dump_config
    then:
      - lambda: |-
          ESP_LOGCONFIG("${TAG_ESPNOW_SENDER}", "ESP-NOW Sender settings:");
          esphome::text::Text *const mac_texts[4] = {
            txt_gang_1_espnow_target_mac, txt_gang_2_espnow_target_mac,
            txt_gang_3_espnow_target_mac, txt_gang_4_espnow_target_mac
          };
          esphome::select::Select *const target_gang_selects[4] = {
            sl_gang_1_espnow_target_gang, sl_gang_2_espnow_target_gang,
            sl_gang_3_espnow_target_gang, sl_gang_4_espnow_target_gang
          };
          esphome::select::Select *const mode_selects[4] = {
            sl_gang_1_espnow_mode, sl_gang_2_espnow_mode,
            sl_gang_3_espnow_mode, sl_gang_4_espnow_mode
          };
          for (uint8_t i = 0; i < ${gang_count}; i++) {
            ESP_LOGCONFIG("${TAG_ESPNOW_SENDER}", "  Gang %" PRIu8 ": Mode=%s, Target MAC=%s, Target Gang=%s",
                          i + 1,
                          mode_selects[i]->current_option().c_str(),
                          mac_texts[i]->state.c_str(),
                          target_gang_selects[i]->current_option().c_str());
          }

  - id: !extend dump_config_list_packages
    then:
      - script.wait: dump_config
      - lambda: |-
          #ifndef TX_ULTIMATE_EASY_HW_BUTTONS
            #error "The package TX-Ultimate-Easy-ESPHome_hw_buttons.yaml is required."
          #endif
          ESP_LOGCONFIG(ESPHOME_PROJECT_NAME, "  - ESP-NOW Sender");

  - id: espnow_send
    mode: queued
    max_runs: 10
    parameters:
      button: uint8_t
    then:
      - if:
          condition:
            - lambda: |-
                if (button < 1 || button > ${gang_count}) return false;
                esphome::select::Select *const mode_selects[4] = {
                  sl_gang_1_espnow_mode, sl_gang_2_espnow_mode,
                  sl_gang_3_espnow_mode, sl_gang_4_espnow_mode
                };
                const uint8_t idx = button - 1;
                switch (mode_selects[idx]->active_index().value_or(0)) {
                  case 1:  // Always
                    break;
                  case 2:  // API failsafe only
                    if (global_api_server->is_connected_with_state_subscription() && wifi_component->is_connected()) {
                      return false;
                    }
                    break;
                  default:  // Off
                    return false;
                }

                using esphome::tx_ultimate_easy::parse_mac_address;
                esphome::text::Text *const mac_texts[4] = {
                  txt_gang_1_espnow_target_mac, txt_gang_2_espnow_target_mac,
                  txt_gang_3_espnow_target_mac, txt_gang_4_espnow_target_mac
                };
                uint8_t mac[6];
                return parse_mac_address(mac_texts[idx]->state, mac);
          then:
            - delay: ${espnow_send_delay}
            - espnow.send:
                id: espnow_component
                address: !lambda |-
                  using esphome::tx_ultimate_easy::parse_mac_address;
                  const uint8_t idx = button - 1;
                  esphome::text::Text *const mac_texts[4] = {
                    txt_gang_1_espnow_target_mac, txt_gang_2_espnow_target_mac,
                    txt_gang_3_espnow_target_mac, txt_gang_4_espnow_target_mac
                  };
                  uint8_t mac[6] = {0};
                  parse_mac_address(mac_texts[idx]->state, mac);
                  return {mac[0], mac[1], mac[2], mac[3], mac[4], mac[5]};
                data: !lambda |-
                  const uint8_t idx = button - 1;
                  esphome::select::Select *const target_gang_selects[4] = {
                    sl_gang_1_espnow_target_gang, sl_gang_2_espnow_target_gang,
                    sl_gang_3_espnow_target_gang, sl_gang_4_espnow_target_gang
                  };
                  const uint8_t target_gang = static_cast<uint8_t>(
                      target_gang_selects[idx]->active_index().value_or(idx) + 1);
                  return {0x01, target_gang};
                wait_for_sent: false
                on_sent:
                  - lambda: |-
                      const uint8_t idx = button - 1;
                      esphome::text::Text *const mac_texts[4] = {
                        txt_gang_1_espnow_target_mac, txt_gang_2_espnow_target_mac,
                        txt_gang_3_espnow_target_mac, txt_gang_4_espnow_target_mac
                      };
                      esphome::select::Select *const target_gang_selects[4] = {
                        sl_gang_1_espnow_target_gang, sl_gang_2_espnow_target_gang,
                        sl_gang_3_espnow_target_gang, sl_gang_4_espnow_target_gang
                      };
                      ESP_LOGI("${TAG_ESPNOW_SENDER}",
                               "ESP-NOW sent: gang %" PRIu8 " -> MAC=%s, target gang=%s",
                               button,
                               mac_texts[idx]->state.c_str(),
                               target_gang_selects[idx]->current_option().c_str());
                on_error:
                  - lambda: |-
                      const uint8_t idx = button - 1;
                      esphome::text::Text *const mac_texts[4] = {
                        txt_gang_1_espnow_target_mac, txt_gang_2_espnow_target_mac,
                        txt_gang_3_espnow_target_mac, txt_gang_4_espnow_target_mac
                      };
                      ESP_LOGE("${TAG_ESPNOW_SENDER}",
                               "ESP-NOW send failed: gang %" PRIu8 " -> MAC=%s",
                               button,
                               mac_texts[idx]->state.c_str());
...
