blueprint:
  name: TX Ultimate Easy - Gang Link (one physical, many virtuals)
  description: >
    Links one physical relay/light (the source of truth) to any number of other
    switch/light entities, typically the Virtual Relay entities exposed by TX
    Ultimate Easy panels. Propagates state on Home Assistant startup, on
    automation reload, when a panel reconnects, and whenever any linked panel
    changes state deliberately. Only the panel that was actually touched needs to
    provide local feedback; propagation through Home Assistant only updates state.

    Optionally configures ESP-NOW hardware peer-to-peer binding automatically so
    linked switches provide instant 4ms response and continue working completely
    offline even if Home Assistant or Wi-Fi is down.
  domain: automation
  input:
    physical_entity:
      name: Physical relay (source of truth)
      description: >
        The entity that drives the real relay or load. Exactly one entity.
      selector:
        entity:
          domain:
            - switch
            - light
    virtual_entities:
      name: Linked panels (virtual relays)
      description: >
        Any number of switch/light entities to keep in sync with the physical
        relay. Typically the "Virtual Relay N" entities of other panels.
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true
    auto_bind_espnow:
      name: Automatic ESP-NOW Peer-to-Peer Binding (Optional)
      description: >
        When enabled, Home Assistant automatically configures the linked panels'
        ESP-NOW runtime settings (Target MAC, Target Gang, and Send Mode) and
        enables ESP-NOW receiving on the physical relay panel. This provides
        hardware-level 4ms response and ensures switches keep working even if
        Home Assistant or Wi-Fi is completely offline.
      default: false
      selector:
        boolean:
    espnow_send_mode:
      name: ESP-NOW Send Mode
      description: >
        How the linked panels should communicate via ESP-NOW.
        "API failsafe only": Uses Home Assistant normally, activates ESP-NOW only when HA/Wi-Fi is offline.
        "Always": Sends ESP-NOW peer-to-peer on every click for instant 4ms hardware response.
      default: "API failsafe only"
      selector:
        select:
          options:
            - "API failsafe only"
            - "Always"

# Resolved once per run so templates can reference the selected entities.
variables:
  physical: !input physical_entity
  virtuals: !input virtual_entities
  auto_espnow: !input auto_bind_espnow
  espnow_mode_val: !input espnow_send_mode

trigger:
  - platform: homeassistant
    event: start
    id: startup
  - platform: event
    event_type: automation_reloaded
    id: reloaded
  - platform: state
    entity_id: !input physical_entity
    from:
      - unavailable
      - unknown
    id: reconnect_physical
  - platform: state
    entity_id: !input virtual_entities
    from:
      - unavailable
      - unknown
    id: reconnect_virtual
  - platform: state
    entity_id: !input physical_entity
    not_from:
      - unavailable
      - unknown
    to:
      - "on"
      - "off"
    id: change_physical
  - platform: state
    entity_id: !input virtual_entities
    not_from:
      - unavailable
      - unknown
    to:
      - "on"
      - "off"
    id: change_virtual

condition:
  - condition: template
    value_template: "{{ states(physical) in ['on', 'off'] }}"
  # Ignore state changes caused by this automation's own service calls (or any
  # automation driving a virtual relay) to prevent echo amplification and bounce.
  - condition: template
    value_template: >-
      {% set self_ctx = context.id if (context is defined and context.id is defined) else '' %}
      {{ trigger.id not in ['change_physical', 'change_virtual']
         or (
           trigger.to_state.context.id != self_ctx
           and trigger.to_state.context.parent_id != self_ctx
           and (trigger.id != 'change_virtual' or trigger.to_state.context.parent_id is none)
         ) }}

mode: queued
max: 20
max_exceeded: warning

action:
  # Optional automatic ESP-NOW hardware binding for offline peer-to-peer control
  - if:
      - condition: template
        value_template: >-
          {{ auto_espnow | default(false)
             and trigger.id in ['startup', 'reloaded', 'reconnect_physical', 'reconnect_virtual'] }}
    then:
      - variables:
          p_dev: "{{ device_id(physical) }}"
          p_macs: >-
            {{ device_attr(p_dev, 'connections') | selectattr('0', 'eq', 'mac') | map(attribute='1') | list if p_dev else [] }}
          p_mac: "{{ p_macs[0] if p_macs else '' }}"
          p_gang_match: "{{ physical | regex_findall('(\\d+)$') }}"
          p_gang_num: "{{ p_gang_match[0] if p_gang_match else '1' }}"
          p_gang_str: "{{ 'Gang ' ~ p_gang_num }}"
          p_ents: "{{ device_entities(p_dev) if p_dev else [] }}"
          p_recv: "{{ p_ents | select('match', '.*esp_now_receive_enabled$') | list }}"
          v_list: >-
            {{ virtuals if (virtuals is not string and virtuals is sequence) else [virtuals] }}
      # Ensure ESP-NOW receive is enabled on the physical relay panel
      - if:
          - condition: template
            value_template: "{{ p_recv and states(p_recv[0]) == 'off' }}"
        then:
          - action: switch.turn_on
            target:
              entity_id: "{{ p_recv[0] }}"
      # Program target MAC, target gang, and send mode on each virtual panel
      - repeat:
          for_each: "{{ v_list }}"
          sequence:
            - variables:
                v_dev: "{{ device_id(repeat.item) }}"
                v_ents: "{{ device_entities(v_dev) if v_dev else [] }}"
                v_gang_match: "{{ repeat.item | regex_findall('(\\d+)$') }}"
                v_gang_num: "{{ v_gang_match[0] if v_gang_match else '1' }}"
                mac_ent: "{{ (v_ents | select('match', '.*gang_' ~ v_gang_num ~ '_esp_now_target_mac$') | list)[0] | default('') }}"
                gang_ent: "{{ (v_ents | select('match', '.*gang_' ~ v_gang_num ~ '_esp_now_target_gang$') | list)[0] | default('') }}"
                mode_ent: "{{ (v_ents | select('match', '.*gang_' ~ v_gang_num ~ '_esp_now_mode$') | list)[0] | default('') }}"
            - if:
                - condition: template
                  value_template: "{{ p_mac != '' and mac_ent != '' and states(mac_ent) != p_mac }}"
              then:
                - action: text.set_value
                  target:
                    entity_id: "{{ mac_ent }}"
                  data:
                    value: "{{ p_mac }}"
            - if:
                - condition: template
                  value_template: "{{ gang_ent != '' and states(gang_ent) != p_gang_str }}"
              then:
                - action: select.select_option
                  target:
                    entity_id: "{{ gang_ent }}"
                  data:
                    option: "{{ p_gang_str }}"
            - if:
                - condition: template
                  value_template: "{{ mode_ent != '' and states(mode_ent) != espnow_mode_val }}"
              then:
                - action: select.select_option
                  target:
                    entity_id: "{{ mode_ent }}"
                  data:
                    option: "{{ espnow_mode_val }}"

  - variables:
      # Reconnects and initialisation always follow the physical relay.
      # A deliberate state change follows the panel that changed.
      desired: >-
        {% if trigger is defined and trigger.platform == 'state'
              and trigger.from_state is not none
              and trigger.from_state.state in ['unavailable', 'unknown'] %}
          {{ states(physical) }}
        {% elif trigger is defined and trigger.platform == 'state'
              and trigger.entity_id is defined %}
          {{ trigger.to_state.state }}
        {% else %}
          {{ states(physical) }}
        {% endif %}
      all_entities: >-
        {{ [physical] + (virtuals if (virtuals is not string
            and virtuals is sequence) else [virtuals]) }}
  - repeat:
      for_each: "{{ all_entities }}"
      sequence:
        - if:
            - condition: template
              value_template: >-
                {{ states(repeat.item) not in ['unavailable', 'unknown']
                   and (
                     states(repeat.item) != desired
                     or (trigger.id in ['change_physical', 'change_virtual']
                         and repeat.item != trigger.entity_id)
                   ) }}
          then:
            - action: "homeassistant.turn_{{ desired }}"
              target:
                entity_id: "{{ repeat.item }}"
