####################################################################################################
#####                              TX Ultimate Easy for ESPHome                                #####
#####                  Repository: https://github.com/edwardtfn/TX-Ultimate-Easy               #####
##### Purpose: ESPHome - ESP-NOW - Receiver - Communication for Multi-Device Relay Control     #####
####################################################################################################
##### Author: jakub-k-dev - https://github.com/jakub-k-dev                                     #####
####################################################################################################
##### NOTE:                                                                                    #####
##### - Make changes ONLY if absolutely necessary and you have the required knowledge.         #####
##### - For normal system use, modifications to this file are NOT required.                    #####
####################################################################################################
---
substitutions:
  TAG_ESPNOW_RECEIVER: tx_ultimate_easy.espnow.receiver

esphome:
  build_flags:
    - -D TX_ULTIMATE_EASY_ESPNOW_RECEIVER

espnow:
  id: espnow_component
  auto_add_peer: true
  on_receive:
    lambda: |-
      if (!sw_espnow_receive_enabled->state) {
        ESP_LOGD("${TAG_ESPNOW_RECEIVER}", "ESP-NOW receiving disabled, ignoring message");
        return;
      }
      if (data == nullptr || size < 2) {
        return;
      }

      const uint8_t command = data[0];
      const uint8_t gang_num = data[1];

      if (command != 0x01) {
        return;  // Only handle toggle commands (0x01)
      }

      if (gang_num < 1 || gang_num > ${gang_count}) {
        ESP_LOGW("${TAG_ESPNOW_RECEIVER}", "Invalid gang number: %" PRIu8 " (valid range: 1-${gang_count})", gang_num);
        return;
      }

      ESP_LOGI("${TAG_ESPNOW_RECEIVER}", "ESP-NOW toggle received for gang %" PRIu8, gang_num);
      toggle_gang->execute(gang_num);

      // Determine state after toggle to reply to sender
      const uint8_t idx = gang_num - 1;
      using esphome::tx_ultimate_easy::GangMode;
      esphome::select::Select *const gang_modes[4] = {
          sl_gang_1_mode, sl_gang_2_mode, sl_gang_3_mode, sl_gang_4_mode};
      const auto mode = static_cast<GangMode>(gang_modes[idx]->active_index().value_or(1));
      const bool current_state = (mode == GangMode::VirtualRelay) ?
          id(virtual_relay_states)[idx] : id(relay_states)[idx];

      espnow_send_state_reply->execute(info.src_addr[0], info.src_addr[1], info.src_addr[2],
                                       info.src_addr[3], info.src_addr[4], info.src_addr[5],
                                       gang_num, static_cast<uint8_t>(current_state ? 1 : 0));

script:
  - id: espnow_send_state_reply
    mode: parallel
    parameters:
      m0: uint8_t
      m1: uint8_t
      m2: uint8_t
      m3: uint8_t
      m4: uint8_t
      m5: uint8_t
      gang: uint8_t
      state: uint8_t
    then:
      - espnow.send:
          id: espnow_component
          address: !lambda |-
            return {m0, m1, m2, m3, m4, m5};
          data: !lambda |-
            return {0x02, gang, state};
          wait_for_sent: false

  - id: !extend dump_config_list_packages
    then:
      - script.wait: dump_config
      - lambda: |-
          #ifndef TX_ULTIMATE_EASY_HW_RELAYS
            #error "The package TX-Ultimate-Easy-ESPHome_hw_relays.yaml is required."
          #endif
          ESP_LOGCONFIG(ESPHOME_PROJECT_NAME, "  - ESP-NOW Receiver");

switch:
  - id: sw_espnow_receive_enabled
    name: ESP-NOW Receive Enabled
    platform: template
    optimistic: true
    restore_mode: restore_default_off
    internal: false
    entity_category: config
    icon: mdi:radio
    on_turn_on:
      then:
        - lambda: |-
            ESP_LOGI("${TAG_ESPNOW_RECEIVER}", "ESP-NOW receiving enabled");
    on_turn_off:
      then:
        - lambda: |-
            ESP_LOGI("${TAG_ESPNOW_RECEIVER}", "ESP-NOW receiving disabled");

text_sensor:
  - platform: wifi_info
    mac_address:
      name: ESP-NOW MAC Address
      entity_category: diagnostic
      icon: mdi:radio
...
